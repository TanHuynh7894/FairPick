name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contracts (forge)
        run: forge build && forge test
      - name: Node (2-of-3 signing against anvil)
        working-directory: node
        run: npm ci && npm test && npm run typecheck
      - name: Dashboard (tests, typecheck, build)
        working-directory: dashboard
        run: npm ci && npm test && cp .env.example .env.local && npm run build
